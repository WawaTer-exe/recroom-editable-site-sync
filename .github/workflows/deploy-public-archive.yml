name: Deploy public recroom.network archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified public archive snapshot
        env:
          ARCHIVE_SNAPSHOT_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310519663865592103/RaimIKhChKORFPnT.gz
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$ARCHIVE_SNAPSHOT_URL" --output /tmp/dist-archive.tar.gz
          rm -rf dist-archive
          mkdir -p dist-archive
          tar -xzf /tmp/dist-archive.tar.gz -C dist-archive
          test -s dist-archive/index.html
          test -s dist-archive/_archive/routes.json
      - name: Inject archived profile and room photos
        run: node scripts/inject-archived-media.mjs dist-archive seed/profile_photos_live_full.json seed/room_photos_live.json
      - name: Apply DreamRec branding
        run: node scripts/apply-dreamrec-branding.mjs dist-archive
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-archive

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
